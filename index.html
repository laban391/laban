<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        h1 {
            text-align: center;
            color: #2575fc;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .form-group {
            flex: 1;
            min-width: 250px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        input:focus {
            border-color: #6a11cb;
            outline: none;
            box-shadow: 0 0 0 3px rgba(106, 17, 203, 0.1);
        }
        
        .required {
            color: red;
        }
        
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 15px 40px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .submit-btn {
            background: linear-gradient(to right, #00b09b, #96c93d);
            color: white;
        }
        
        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 176, 155, 0.4);
        }
        
        .download-btn {
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            color: white;
        }
        
        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 126, 95, 0.4);
        }
        
        .reset-btn {
            background: linear-gradient(to right, #8e2de2, #4a00e0);
            color: white;
        }
        
        .reset-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(142, 45, 226, 0.4);
        }
        
        .message {
            text-align: center;
            padding: 15px;
            margin: 20px 0;
            border-radius: 8px;
            display: none;
        }
        
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .instructions {
            background: #fff8e1;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 5px solid #ffc107;
        }
        
        .instructions h3 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .instructions ul {
            padding-left: 20px;
            color: #666;
        }
        
        .instructions li {
            margin-bottom: 5px;
        }
        
        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
            }
            
            .buttons {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 Student Registration Form</h1>
        <p class="subtitle">Fill in your details and download as Word document</p>
        
        <div class="instructions">
            <h3>📝 Instructions:</h3>
            <ul>
                <li>Fill ALL fields marked with <span class="required">*</span></li>
                <li>Course field - Type manually (not dropdown)</li>
                <li>Submit first → Then download</li>
            </ul>
        </div>
        
        <div class="message" id="message"></div>
        
        <form id="studentForm">
            <!-- Row 1 -->
            <div class="form-row">
                <div class="form-group">
                    <label>Username <span class="required">*</span></label>
                    <input type="text" id="username" required placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label>First Name <span class="required">*</span></label>
                    <input type="text" id="firstName" required placeholder="Enter first name">
                </div>
            </div>
            
            <!-- Row 2 -->
            <div class="form-row">
                <div class="form-group">
                    <label>Last Name <span class="required">*</span></label>
                    <input type="text" id="lastName" required placeholder="Enter last name">
                </div>
                <div class="form-group">
                    <label>Institution <span class="required">*</span></label>
                    <input type="text" id="institution" required placeholder="Enter school/university">
                </div>
            </div>
            
            <!-- Row 3 -->
            <div class="form-row">
                <div class="form-group">
                    <label>Course <span class="required">*</span></label>
                    <input type="text" id="course" required placeholder="Type your course name">
                </div>
                <div class="form-group">
                    <label>Email <span class="required">*</span></label>
                    <input type="email" id="email" required placeholder="student@school.edu">
                </div>
            </div>
            
            <!-- Row 4 -->
            <div class="form-row">
                <div class="form-group">
                    <label>Password <span class="required">*</span></label>
                    <input type="password" id="password" required placeholder="Create password">
                </div>
                <div class="form-group">
                    <label>Phone 1 <span class="required">*</span></label>
                    <input type="tel" id="phone1" required placeholder="+254700123456">
                </div>
            </div>
            
            <!-- Row 5 -->
            <div class="form-row">
                <div class="form-group">
                    <label>Phone 2 (Optional)</label>
                    <input type="tel" id="phone2" placeholder="+254711987654">
                </div>
            </div>
            
            <!-- Buttons -->
            <div class="buttons">
                <button type="submit" class="submit-btn">
                    <span>✓</span> Submit Form
                </button>
                <button type="button" class="download-btn" id="downloadBtn">
                    <span>📥</span> Download Word
                </button>
                <button type="reset" class="reset-btn">
                    <span>🔄</span> Clear Form
                </button>
            </div>
        </form>
    </div>

    <script>
        // Simple working solution
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('studentForm');
            const downloadBtn = document.getElementById('downloadBtn');
            const messageDiv = document.getElementById('message');
            let formData = null;
            
            // Show message function
            function showMessage(text, type) {
                messageDiv.textContent = text;
                messageDiv.className = `message ${type}`;
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 5000);
            }
            
            // Form submission
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Get all values
                const data = {
                    username: document.getElementById('username').value.trim(),
                    firstName: document.getElementById('firstName').value.trim(),
                    lastName: document.getElementById('lastName').value.trim(),
                    institution: document.getElementById('institution').value.trim(),
                    course: document.getElementById('course').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    password: document.getElementById('password').value,
                    phone1: document.getElementById('phone1').value.trim(),
                    phone2: document.getElementById('phone2').value.trim()
                };
                
                // Check if any field is empty
                const requiredFields = ['username', 'firstName', 'lastName', 'institution', 'course', 'email', 'password', 'phone1'];
                let isValid = true;
                
                requiredFields.forEach(field => {
                    if (!data[field]) {
                        isValid = false;
                        document.getElementById(field).style.borderColor = 'red';
                    } else {
                        document.getElementById(field).style.borderColor = '#ddd';
                    }
                });
                
                if (!isValid) {
                    showMessage('Please fill in all required fields!', 'error');
                    return;
                }
                
                // Save form data
                formData = data;
                
                // Show success message
                showMessage(`✅ Registration successful! ${data.firstName} ${data.lastName} is registered. Click "Download Word" to save.`, 'success');
                
                // Enable download button
                downloadBtn.disabled = false;
                downloadBtn.style.opacity = "1";
                downloadBtn.style.cursor = "pointer";
            });
            
            // Download Word document - SIMPLE WORKING VERSION
            downloadBtn.addEventListener('click', function() {
                if (!formData) {
                    showMessage('Please submit the form first!', 'error');
                    return;
                }
                
                // Create Word document content
                const wordContent = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' 
                xmlns:w='urn:schemas-microsoft-com:office:word' 
                xmlns='http://www.w3.org/TR/REC-html40'>
                <head>
                <meta charset="utf-8">
                <title>Student Registration</title>
                <style>
                    body { font-family: Arial, sans-serif; margin: 40px; }
                    h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
                    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
                    td { padding: 10px; border-bottom: 1px solid #ddd; }
                    .label { font-weight: bold; color: #2c3e50; width: 30%; }
                </style>
                </head>
                <body>
                    <h1>STUDENT REGISTRATION FORM</h1>
                    <p>Generated: ${new Date().toLocaleDateString()}</p>
                    
                    <table>
                        <tr><td class="label">Full Name:</td><td>${formData.firstName} ${formData.lastName}</td></tr>
                        <tr><td class="label">Username:</td><td>${formData.username}</td></tr>
                        <tr><td class="label">Institution:</td><td>${formData.institution}</td></tr>
                        <tr><td class="label">Course:</td><td>${formData.course}</td></tr>
                        <tr><td class="label">Email:</td><td>${formData.email}</td></tr>
                        <tr><td class="label">Password:</td><td>${formData.password}</td></tr>
                        <tr><td class="label">Primary Phone:</td><td>${formData.phone1}</td></tr>
                        <tr><td class="label">Secondary Phone:</td><td>${formData.phone2 || 'Not provided'}</td></tr>
                    </table>
                    
                    <p style="margin-top: 40px; text-align: center; color: #666;">
                        © 2023 Student Registration System
                    </p>
                </body>
                </html>
                `;
                
                // Create blob and download
                const blob = new Blob(['\ufeff', wordContent], { 
                    type: 'application/msword' 
                });
                
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `Student_${formData.firstName}_${formData.lastName}.doc`;
                
                // Add to page, click, and remove
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                // Clean up
                URL.revokeObjectURL(url);
                
                showMessage(`✅ Word document downloaded! Check your Downloads folder.`, 'success');
            });
            
            // Disable download button initially
            downloadBtn.disabled = true;
            downloadBtn.style.opacity = "0.7";
            downloadBtn.style.cursor = "not-allowed";
            
            // Show welcome message
            setTimeout(() => {
                showMessage('Welcome! Fill all fields and submit first, then download.', 'success');
            }, 1000);
        });
    </script>
</body>
</html>
